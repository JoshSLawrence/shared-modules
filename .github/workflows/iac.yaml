# iac workflow
# Plans the iac/ root module (this repository's GitHub settings) on every PR
# that touches it, posts the plan on the PR, and applies that exact plan once
# a reviewer approves the `iac-apply` environment -- so changes are applied
# from the PR before merging, as iac/README.md describes. Run it manually on
# main (Actions -> iac -> Run workflow) to re-apply main, e.g. to roll back a
# PR that was applied but won't be merged.
#
# Setup: see "Enabling the iac workflow" in iac/README.md. Until the
# IAC_AZURE_CLIENT_ID repository variable exists, every job is skipped.
#
# Job layout (deliberate):
# - plan: runs in the `iac-plan` environment (no approval), whose GitHub
#   token can only read. Plans to a file, uploads it as an artifact, and
#   posts the summary on the PR.
# - apply: only when the plan has changes. Runs in the `iac-apply`
#   environment, so it waits for approval before it can use that
#   environment's (write) GitHub token. Checks the plan is still current,
#   then applies the uploaded plan.
#
# Each environment holds its own IAC_GITHUB_TOKEN secret, so the same name
# resolves to the read or write token depending on the job. Both jobs reach
# the state (Azure Storage, see iac/backend.tf) as the same Azure identity.
#
# Not a required check: nothing forces an apply before merging, and a PR that
# doesn't touch iac/ never runs this workflow.

name: iac

on:
  pull_request:
    branches:
      - main
    paths:
      - iac/**
      - .github/workflows/iac.yaml
      - .github/scripts/common.sh
      - .github/scripts/iac-*.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKING_DIR: iac
  # Only iac/mise.toml's pins are installed and used, not the repo root's
  MISE_CEILING_PATHS: ${{ github.workspace }}
  # What's being planned, for the scripts. A PR run plans GitHub's merge of
  # the PR head into main (the default checkout), so applying never reverts
  # anything main gained since the branch was cut. A manual run plans main.
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  plan:
    name: Plan
    # PRs from forks get neither the environment secrets nor an OIDC token,
    # so they can't plan -- see CONTRIBUTING.md#reviewing-external-pull-requests.
    # Manual runs only ever plan main.
    if: >-
      vars.IAC_AZURE_CLIENT_ID != '' && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    environment: iac-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push supersedes a plan still in progress. Safe to cancel: plans
    # don't lock the state (see iac-plan.sh).
    concurrency:
      group: iac-plan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # Azure OIDC for the state backend
      pull-requests: write # plan comment
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
          working_directory: ${{ env.WORKING_DIR }}

      # No `az login`: the azurerm backend fetches the GitHub OIDC token
      # itself (ARM_USE_OIDC).
      - name: Plan
        id: plan
        run: .github/scripts/iac-plan.sh
        env:
          GITHUB_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.IAC_AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.IAC_AZURE_TENANT_ID }}

      # The plan file embeds the configuration and a copy of the state, and
      # artifacts of a public repository can be downloaded by any signed-in
      # user. Fine while iac/ state holds no secrets -- keep it that way.
      - name: Upload plan
        if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iac-plan
          path: ${{ runner.temp }}/iac-plan/
          if-no-files-found: error
          retention-days: 7
          # A full re-run uploads again under the same name; apply checks
          # the digest from this attempt's plan output either way.
          overwrite: true

      - name: Comment plan on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: .github/scripts/iac-pr-comment.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/iac-plan/summary.md
          APPLY_STATUS: ${{ steps.plan.outputs.has-changes == 'true' && 'awaiting-approval' || 'none' }}

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.has-changes == 'true'
    # Waits here for a reviewer's approval (iac/environments.tf). The
    # environment's secret and the Azure federated credential are only
    # available once approved.
    environment: iac-apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One apply at a time across the repository, and never cancel one that's
    # running -- that could leave the repository half-changed and the state
    # locked. A newer run's apply queues behind; reject approvals for runs
    # that have been superseded (their apply would be refused anyway).
    concurrency:
      group: iac-apply
      cancel-in-progress: false
    permissions:
      actions: read # who approved, for the PR comment
      contents: read
      id-token: write # Azure OIDC for the state backend
      pull-requests: write # apply result comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the preflight check, so a refused apply still comments the
      # plan summary alongside the failure.
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iac-plan
          path: ${{ runner.temp }}/iac-plan

      - name: Check the plan is still current
        run: .github/scripts/iac-apply-preflight.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
          working_directory: ${{ env.WORKING_DIR }}

      # GITHUB_TOKEN is the admin token from the environment, and no GH_TOKEN
      # is set: the gh calls in iac/scripts/ (run by local-exec) need it.
      - name: Apply
        run: .github/scripts/iac-apply.sh
        env:
          GITHUB_TOKEN: ${{ secrets.IAC_GITHUB_TOKEN }}
          PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.IAC_AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.IAC_AZURE_TENANT_ID }}

      - name: Comment apply result on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: .github/scripts/iac-pr-comment.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/iac-plan/summary.md
          APPLY_STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
